version: '3.8'

services:
  trading-api:
    build: .
    ports:
      - "5001:5001"
    environment:
      - FLASK_DEBUG=false
      - PORT=5001
    command: ["python", "API-App/app.py"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data:ro
    
  trading-dashboard:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_DEBUG=false
      - PORT=5000
    command: ["python", "App/app.py"]
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data:ro
      - ./App/static/plots:/app/App/static/plots
    depends_on:
      - trading-api

  # Optional: Redis for caching (future enhancement)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data: